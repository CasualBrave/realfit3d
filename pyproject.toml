[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realfit3d"
version = "0.1.0"
description = "Local integration of Gaussian Garments virtual try-on"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
realfit3d = ["workers/*.py", "workers/contourcraft/*.py", "quality/*.py"]

[project.scripts]
realfit3d = "realfit3d.cli:main"
